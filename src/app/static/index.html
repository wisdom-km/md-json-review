<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>核对题页</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="title-block">
      <p class="mark">只在本机</p>
      <h1>核对题页</h1>
    </div>
    <div class="tools">
      <button id="pick-book" type="button">选择书目录</button>
      <span id="book-name" class="choice">未选择</span>
      <button id="pick-pdf" type="button">选择 PDF</button>
      <span id="pdf-name" class="choice">未选择</span>
      <div class="pager">
        <button id="prev-page" type="button" disabled>上一页</button>
        <select id="page-select" aria-label="当前页" disabled></select>
        <button id="next-page" type="button" disabled>下一页</button>
        <select id="page-role" aria-label="这一页是题目还是参考答案" disabled>
          <option value="questions">题目页</option>
          <option value="answers">参考答案页</option>
        </select>
      </div>
      <button id="save" type="button" disabled>保存</button>
      <button id="export" type="button" class="secondary" disabled>导出</button>
    </div>
  </header>
  <p id="status" class="status" role="status">先选择书目录和 PDF。改字后会自动保存，也可以按保存。</p>
  <main class="workspace">
    <section class="pane" aria-label="原页">
      <div class="pane-head">
        <h2>原页</h2>
        <a id="pdf-link" href="/pdf" target="_blank" rel="noopener">在新标签打开</a>
      </div>
      <iframe id="pdf-frame" title="原始 PDF" src="about:blank"></iframe>
    </section>
    <section class="pane" aria-label="Markdown">
      <div class="pane-head">
        <h2>Markdown</h2>
        <p class="hint">点一行编辑，其余仍是预览</p>
      </div>
      <p id="rules" class="rules">打开一页后，这里会写明这一页有几块。</p>
      <div id="markdown-body" class="markdown-body">
        <article id="rendered" class="rendered" aria-label="Markdown"></article>
      </div>
    </section>
    <section class="pane" aria-label="JSON 预览">
      <div class="pane-head">
        <h2 id="draft-heading">题目草稿</h2>
      </div>
      <div id="drafts" class="drafts" aria-live="polite"></div>
      <div class="pane-head">
        <h2>JSON 预览</h2>
      </div>
      <pre id="json" class="json" aria-live="polite"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
