[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "md-json-review"
version = "0.1.0"
description = "本机核对 OCR 页，并写出题目草稿和答案草稿。"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_json_review = ["split_rules.json"]
